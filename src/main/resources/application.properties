spring.application.name=retail-inventory
server.port=8080

# Secrets are read from environment variables or from a local ".env" file (see .env.example)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Schema is managed by database/schema.sql, Hibernate must not change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8

# CORS: comma separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health

# Sarthi AI assistant (read-only). Leave GROQ_API_KEY empty to disable it.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.base-url=https://api.groq.com/openai/v1
